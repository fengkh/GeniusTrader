services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geniustrader_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_ENCRYPTION_KEYS: ${APP_ENCRYPTION_KEYS:?required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?required}
      PUBLIC_REGISTRATION_ENABLED: "false"
      ANNOUNCEMENT_INGESTION_ENABLED: "false"
      ANNOUNCEMENT_REAL_NETWORK_ENABLED: "false"
      ANNOUNCEMENT_CNINFO_ENABLED: "false"
      ANNOUNCEMENT_SSE_ENABLED: "false"
      ANNOUNCEMENT_BSE_ENABLED: "false"
      MARKET_DATA_PROVIDER_ENABLED: "false"
      MARKET_DATA_SYNC_ENABLED: "false"
      MARKET_DATA_REAL_NETWORK_ENABLED: "false"
      MARKET_DATA_TUSHARE_ENABLED: "false"
      MARKET_DATA_MOCK_ENABLED: "false"
      MARKET_DATA_TUSHARE_AUTHORIZATION_STATUS: unverified
      SECURITY_MASTER_BAOSTOCK_ENABLED: "false"
    expose:
      - "8000"
    networks:
      - geniustrader_internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/}
    expose:
      - "3000"
    networks:
      - geniustrader_internal

  nginx:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      GENIUSTRADER_SERVER_NAME: ${GENIUSTRADER_SERVER_NAME:?required}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE:-/etc/nginx/certs/fullchain.pem}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY:-/etc/nginx/certs/privkey.pem}
    volumes:
      - ./deploy/nginx/geniustrader.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${NGINX_CERTS_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - geniustrader_internal

volumes:
  postgres_data:

networks:
  geniustrader_internal:
    driver: bridge
